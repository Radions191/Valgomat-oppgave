<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valgomat for Stortingsvalget 2025</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Valgomat for Stortingsvalget 2025</h1>
        
        <div id="question-container">
            <p id="progress"></p>
            <p id="question-text">Spørsmål kommer her...</p>
            <form id="answer-form">
                <div class="answers">
                <label>
                    <input type="radio" name="answer" value="Helt uenig">
                    Helt uenig
                </label>
                <label>
                    <input type="radio" name="answer" value="Litt uenig">
                    Litt uenig
                </label>
                <label>
                    <input type="radio" name="answer" value="Nøytral">
                    Nøytral
                </label>
                <label>
                    <input type="radio" name="answer" value="Litt enig">
                    Litt enig
                </label>
                <label>
                    <input type="radio" name="answer" value="Helt enig">
                    Helt enig
                    </label>
                </div>
                
                <div class="buttons">
                    <button type="button" id="prevButton">Tilbake</button>
                    <button type="submit" id="nextButton">Neste</button>
                </div>
            </form>
        </div>
        
        <div id="result-container" style="display: none;">
            <p>Din score: <span id="score"></span></p>
            <div class="buttons">
            <button id="restartButton">Start på nytt</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
